header{background:#1D3557;border-bottom:1px solid #254a73;box-shadow:0 2px 12px #172b4214}
.brand{color:#fff}.brand small{color:#C8D8EA}
.nav button{color:#DCE8F5}.nav button:hover{background:#ffffff18}.nav button.active{background:#F2C14E;color:#1D3557;font-weight:800}
.hero{background:linear-gradient(120deg,#1D3557 0%,#244e7d 100%);box-shadow:0 8px 28px #1D355714}.hero p{color:#E0EAF5}
.btn{background:#2878C8;color:#fff;box-shadow:0 2px 5px #1D355714}.btn:hover{filter:brightness(.93)}.btn.secondary{background:#EFF5FC;color:#1D3557;box-shadow:none}
.hero .btn{background:#F2C14E;color:#1D3557}

.actions,.comments{border-top-color:#E2E8F0}.comment{border-bottom-color:#E2E8F0}
.construction p{color:#64748B}footer{color:#718096}
.overlay{background:#102641B8}.dialog{box-shadow:0 20px 60px #0A20354A}.ghost{color:#2878C8}
/* 技聚 SkillHub：暫定品牌字標與幾何「技」圖形 */
.brand{display:flex;align-items:center;gap:11px;min-width:0;line-height:1.15}.brand-mark{display:flex;align-items:center;justify-content:center;flex:none;background:transparent;padding:0}.brand-mark img{width:60px;height:50px;object-fit:contain;display:block}.brand-words{display:flex;flex-direction:column;gap:4px}.brand-name{white-space:nowrap;font-size:21px;letter-spacing:.02em}.brand-name em{font-style:normal;color:#F2C14E;font-size:16px;font-weight:750;margin-left:3px}.brand small{color:#DCE8F5;font-size:11px;letter-spacing:.06em}.brand:focus-visible{outline:2px solid #F2C14E;outline-offset:5px;border-radius:5px}.hero h1{letter-spacing:.03em}.hero::before{content:"技";font-weight:900;font-size:90px;color:#F2C14E18;position:absolute;right:22%;pointer-events:none}.hero{position:relative;overflow:hidden}.hero>*{position:relative;z-index:1}@media(max-width:650px){.brand{gap:7px}.brand-mark img{width:44px;height:38px}.brand-name{font-size:16px}.brand-name em{font-size:12px}.brand small{font-size:9px;letter-spacing:0}.nav{gap:0}.nav button{padding:8px 7px;font-size:13px}.hero::before{right:12px;font-size:70px}}

.btn.small{padding:6px 10px;font-size:13px}.btn.danger{background:#fff1f2;color:#b42334;box-shadow:none}.comment-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn:disabled{opacity:.65;cursor:default}.admin-link{background:transparent;border:1px solid #d6e5f5;color:#dce8f5;border-radius:9px;padding:7px 10px;font-size:12px}
.test-announcement{margin-top:24px;background:#fff;border:1px solid #d6e3f2;border-left:5px solid #f2c14e;border-radius:14px;overflow:hidden;box-shadow:0 3px 16px #1d355709}.test-announcement-head{background:#eff5fc;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#1d3557}.test-announcement-head span{font-size:12px;background:#f2c14e;padding:5px 10px;border-radius:6px;font-weight:800}.test-announcement-body{padding:18px 22px;color:#334155;line-height:1.85}.test-announcement-body p{margin:0 0 13px}.test-announcement-warning{background:#fff9e8;border-radius:8px;padding:12px 14px}.test-announcement-body .btn{margin-top:4px}
/* V3.1 題庫分類預覽 */
.library-notice{display:flex;align-items:center;gap:10px;background:#FFF7DF;border:1px solid #F2C14E;border-radius:12px;padding:13px 18px;color:#664A08;font-size:14px;margin-bottom:24px}
.library-header{margin:4px 0 22px}.library-header h1{font-size:27px;color:#1D3557;margin:0 0 8px}.library-header p{margin:0;color:#64748B;line-height:1.7}
.library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.library-card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:24px;box-shadow:0 3px 16px #1D355709}
.library-card h2{font-size:20px;color:#1D3557;margin:0 0 8px}.library-card p{color:#64748B;font-size:14px;line-height:1.7;margin:0 0 18px}
.library-types{display:grid;gap:9px}.library-type{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 13px;border:1px solid #E2E8F0;border-radius:9px;background:#F8FAFD;color:#38536F;font-size:14px}.library-type small{color:#8797A9;white-space:nowrap;font-size:12px}
.library-trades{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.library-trades span{border-radius:7px;background:#EFF5FC;color:#355C84;padding:6px 9px;font-size:12px}
@media(max-width:700px){.library-grid{grid-template-columns:1fr}.library-card{padding:19px}.library-notice{align-items:flex-start}}

function date(s){return new Date(s).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})}

async function ensureIdentity(){if(!db)throw Error('無法載入 Supabase，請確認網路連線');
 const {data:{session}}=await db.auth.getSession();if(session?.user){user=session.user;return}
 const {data,error}=await db.auth.signInAnonymously();if(error)throw error;user=data.user;
}
async function checkAdmin(){clearQuestionCache();isAdmin=false;if(!user||user.is_anonymous)return;const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error)console.warn('管理員查詢失敗',error);else isAdmin=!!data}
async function refresh({quiet=false}={}){if(!db)return;if(sessionBusy)return;try{
 const [pr,cr,lr,clr]=await Promise.all([
 db.from('posts').select('id,author,category,trade,title,body,created_at').order('created_at',{ascending:false}).limit(200),
 db.from('comments').select('id,post_id,author,body,created_at,user_id').order('created_at',{ascending:true}).limit(2000),
 db.from('likes').select('id,post_id,user_id').limit(5000),
 db.from('comment_likes').select('id,comment_id,user_id').limit(5000)]);
 for(const r of [pr,cr,lr,clr])if(r.error)throw r.error;
 const cs=cr.data||[],ls=lr.data||[],cls=clr.data||[];
 posts=(pr.data||[]).map(p=>({...p,date:date(p.created_at),comments:cs.filter(c=>c.post_id===p.id).map(c=>({...c,date:date(c.created_at),likes:cls.filter(l=>l.comment_id===c.id).length,liked:cls.some(l=>l.comment_id===c.id&&l.user_id===user?.id)})),likes:ls.filter(l=>l.post_id===p.id).length,liked:ls.some(l=>l.post_id===p.id&&l.user_id===user?.id)}));
 if(!quiet)notice('');
 if(page==='library'){return}else if(page==='article'&&$('commentbody')){saveDraft();renderArticleContent();}else if(page==='forum'&&$('query')){renderListingOnly()}else render();
 }catch(e){console.error(e);if(!quiet)notice('資料讀取失敗：'+e.message)}}

function postHTML(p){return `<div class="post" onclick="navigate('article','${esc(p.id)}')"><span class="tag">${esc(p.category)}</span>${p.trade?`<span class="tag trade">${esc(p.trade)}</span>`:''}<h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.author)}</span><span>${esc(p.date)}</span><span>💬 ${p.comments.length} 則留言</span><span>♡ ${p.likes||0}</span></div></div>`}

function qChangeType(type){qReadFilters();qFilters.competition_type=type;qFilters.trade='';qFilters.stage='';renderLibrary()}

async function qLoad(){
 const version=++qVersion;qLoading=true;qError='';qRows=[];qCloseEditor();qRenderResults();
 try{
  if(!db)throw Error('Supabase 尚未連線，請檢查網路後重試。');
  let query=db.from('question_bank').select(QB_COLUMNS,{count:'exact'});
  if(!isAdmin)query=query.eq('status','published');
  for(const k of ['competition_type','trade','stage','year'])if(qFilters[k])query=query.eq(k,qFilters[k]);
  if(isAdmin&&qFilters.status)query=query.eq('status',qFilters.status);
  // Restrict PostgREST filter syntax to a literal CJK/letter/number search term.
  const term=qFilters.keyword.replace(/[^\p{L}\p{N}\s-]/gu,' ').trim().replace(/\s+/g,' ');
  if(qFilters.keyword&&!term)throw Error('請輸入文字或數字關鍵字。');
  if(term)query=query.or(['title','description','preview_content'].map(c=>`${c}.ilike.%${term}%`).join(','));
  const r=await query.order('year',{ascending:false}).order('created_at',{ascending:false}).order('id',{ascending:false}).range(qOffset,qOffset+19);
  if(r.error)throw r.error;if(version!==qVersion)return;
  qRows=r.data||[];qTotal=r.count||0;qLoaded=true;
 }catch(e){if(version!==qVersion)return;console.error(e);qError='題庫讀取失敗，請確認已執行 05 多 PDF 增量 SQL、資料表權限及網路連線，再按重新載入。'+(e.message?'（'+e.message+'）':'')}
 finally{if(version===qVersion){qLoading=false;qRenderResults()}}
}
function qStatus(s){return ({draft:'草稿',published:'已發布',archived:'已下架'})[s]||s}
function qRenderResults(){const el=$('q-results');if(page!=='library'||!el)return;
 if(qLoading){el.innerHTML='<div class="empty">正在讀取題庫…</div>';return}
 if(qError){el.innerHTML=`<p role="alert" class="q-error">${esc(qError)}</p>`;return}
 el.innerHTML=`<p class="muted">共 ${qTotal} 筆，顯示 ${qRows.length?qOffset+1:0}–${qOffset+qRows.length} 筆</p><div class="panel">${qRows.length?qRows.map(q=>`<article class="q-item"><span class="tag">${esc(q.competition_type)}</span> <span class="tag trade">${esc(q.trade)}</span><h2>${esc(q.title)}</h2><p class="meta">${esc(q.year)} 年 · ${esc(q.stage)}${isAdmin?' · '+esc(qStatus(q.status)):''}</p><p class="q-preview">${esc(q.description.slice(0,160))}</p><button class="btn secondary" onclick="qPreview('${esc(q.id)}')">查看資訊與預覽</button> ${isAdmin?`<button class="btn secondary" onclick="qEdit('${esc(q.id)}')">編輯／發布</button>`:''}</article>`).join(''):'<div class="empty">目前沒有符合條件的題目</div>'}</div><div class="q-toolbar"><button class="btn secondary" ${qOffset===0?'disabled':''} onclick="qMove(-20)">上一頁</button><button class="btn secondary" ${qOffset+20>=qTotal?'disabled':''} onclick="qMove(20)">下一頁</button></div>`;
}
function qMove(delta){qOffset=Math.max(0,qOffset+delta);qLoad()}
function qSize(n){return (Number(n)/1024/1024).toFixed(2)+' MB'}
function qFiles(q){return Array.isArray(q?.pdf_files)?q.pdf_files:(q?.pdf_path?[{path:q.pdf_path,name:q.pdf_name,size:q.pdf_size}]:[])}

 const files=qFiles(q);
 $('q-editor').innerHTML=`<section class="panel article" tabindex="-1" id="q-detail"><h2>${esc(q.title)}</h2><p>${esc(q.competition_type)} · ${esc(q.trade)} · ${esc(q.stage)} · ${esc(q.year)} 年</p><h3>題目介紹</h3><div class="q-preview">${esc(q.description)||'尚無介紹'}</div><h3>文字預覽</h3><div class="q-preview">${esc(q.preview_content)||'尚無文字預覽'}</div><h3>題目 PDF（${files.length} 份）</h3>${files.length?files.map((file,i)=>`<div class="q-attachment"><p>${i+1}. ${esc(file.name)}（${esc(qSize(file.size))}）</p><button id="q-pdf-open-${i}" class="btn secondary" onclick="qReadPdf('${esc(q.id)}',${i})">閱讀第 ${i+1} 份 PDF</button></div>`).join('')+'<div id="q-pdf-view" aria-live="polite"></div>':'<p class="muted">此題尚未上傳 PDF。</p>'}<p class="muted">更新日期：${esc(date(q.updated_at))}</p><button class="btn secondary" onclick="qCloseEditor()">關閉預覽</button></section>`;
 $('q-detail').focus();

async function qReadPdf(id,index=0){const q=qRows.find(q=>q.id===id),file=qFiles(q)[index];if(!file)return;
 qClearPdf();const version=qPdfVersion;const view=$('q-pdf-view'),button=$('q-pdf-open-'+index);if(!view)return;
 if(button)button.disabled=true;view.textContent='正在載入完整 PDF…';
 try{
  const r=await db.storage.from(QB_PDF_BUCKET).download(file.path);if(version!==qPdfVersion||page!=='library')return;if(r.error)throw r.error;
  if(!r.data||r.data.size>QB_PDF_MAX)throw Error('PDF 檔案無法讀取或超過 20 MB。');
  // 不產生可分享的 Storage signed URL；每次載入均由 Storage 驗證目前權限。
  qBlobUrl=URL.createObjectURL(new Blob([r.data],{type:'application/pdf'}));
  view.innerHTML=`<h4>正在閱讀：${esc(file.name)}</h4><div class="q-toolbar"><a class="btn secondary" href="${esc(qBlobUrl)}" target="_blank" rel="noopener">另開分頁閱讀 PDF</a><a class="btn secondary" href="${esc(qBlobUrl)}" download="${esc(file.name||'題目.pdf')}">下載 PDF</a></div><iframe class="q-pdf-frame" title="${esc(file.name)} PDF" src="${esc(qBlobUrl)}"></iframe><p class="notice">若瀏覽器無法內嵌顯示，請另開分頁或下載閱讀。PDF 可儲存，請遵守原作者授權。</p>`;
 }catch(e){if(version===qPdfVersion)view.textContent='PDF 載入失敗，題目可能已下架或尚未完成檔案權限設定。請重新載入題庫後再試。'+(e.message?'（'+e.message+'）':'')}
 finally{if(button)button.disabled=false}
}

 $('q-editor').innerHTML=`<section class="panel q-form"><h2>${id?'編輯題目':'新增題目'}</h2><form class="form" id="q-edit" onsubmit="qSave(event)"><input type="hidden" name="id" value="${esc(q.id||'')}"><input type="hidden" name="updated_at" value="${esc(q.updated_at||'')}">

function qEditType(type){const f=$('q-edit');f.elements.trade.innerHTML=qOptions(QB_TYPES[type].trades);f.elements.stage.innerHTML=qOptions(QB_TYPES[type].stages)}
function qPdfSelected(input){const files=Array.from(input.files||[]);$('q-file-status').textContent=files.length?'待新增 '+files.length+' 份：'+files.map(f=>f.name+'（'+qSize(f.size)+'）').join('、')+'。按「儲存題目」開始上傳。':'沒有選擇新檔；未勾選移除的原有附件會保留。'}
async function qValidatePdf(file){
 if(!/\.pdf$/i.test(file.name))throw Error('請選擇 .pdf 檔案。');
 if(file.name.length>255)throw Error('PDF 檔名請縮短至 255 字以內。');
 if(file.size<5||file.size>QB_PDF_MAX)throw Error('PDF 大小必須介於 5 bytes 與 20 MB。');
 const bytes=new Uint8Array(await file.slice(0,5).arrayBuffer());
 if(String.fromCharCode(...bytes)!=='%PDF-')throw Error('檔案不是有效的 PDF，請勿只修改副檔名。');
}
async function qSave(e){e.preventDefault();if(!isAdmin||qSaving)return;const f=new FormData(e.target),id=f.get('id'),version=f.get('updated_at'),payload={},editVersion=qEditVersion,actor=user?.id;
 for(const k of ['title','competition_type','trade','stage','description','preview_content','status'])payload[k]=String(f.get(k)||'').trim();payload.year=Number(f.get('year'));
 if(!payload.title)return;if(payload.status==='published'&&!confirm('確認題目資訊、預覽文字與完整 PDF 可供所有訪客閱讀及下載？'))return;
 qSaving=true;$('q-save').disabled=true;
 let uploaded=false,committed=false;
 try{
  const files=f.getAll('pdf_file').filter(file=>file?.name),removed=new Set(f.getAll('remove_pdf'));
  if(files.length||removed.size){
   const existing=id?qRows.find(q=>q.id===id):null;if(id&&!existing)throw Error('題目資料已變更，請重新載入後再編輯。');
   const attachments=qFiles(existing).filter(file=>!removed.has(file.path));
   if(attachments.length+files.length>3)throw Error('每題最多 3 份 PDF，請減少新檔或勾選移除舊附件。');
   // 先驗證整批，任何一份不合格都不開始上傳。
   for(const file of files)await qValidatePdf(file);
   for(const [i,file] of files.entries()){
    if(!isAdmin||user?.id!==actor||qEditVersion!==editVersion)throw Error('頁面或登入身分已變更，題目未繼續儲存。');
    $('q-save-status').textContent=`正在上傳第 ${i+1}／${files.length} 份 PDF，請保持此頁開啟…`;
    const attachment={path:crypto.randomUUID()+'.pdf',name:file.name,size:file.size};
    const upload=await db.storage.from(QB_PDF_BUCKET).upload(attachment.path,file,{contentType:'application/pdf',cacheControl:'0',upsert:false});
    if(upload.error)throw upload.error;uploaded=true;attachments.push(attachment);
   }
   payload.pdf_files=attachments;
  }
  if(!isAdmin||user?.id!==actor||qEditVersion!==editVersion)throw Error('頁面或登入身分已變更，題目未繼續儲存。');
  $('q-save-status').textContent='正在儲存題目…';
  const query=id?db.from('question_bank').update(payload).eq('id',id).eq('updated_at',version):db.from('question_bank').insert(payload);
  const r=await query.select('id').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('資料已被其他管理員修改、已不存在，或目前沒有編輯權限。請重新載入後再編輯。');
  committed=true;if(editVersion===qEditVersion){qCloseEditor();qOffset=0;await qLoad()}
 }catch(e){let message='儲存失敗：'+e.message;if(uploaded&&!committed)message+=' 已上傳的檔案保留為私人檔案；若結果不明，請先重新載入確認題目，再決定是否重試。';const el=$('q-save-status');if(editVersion===qEditVersion&&el)el.textContent=message;else error(new Error(message))}
 finally{qSaving=false;if($('q-save'))$('q-save').disabled=false}
}

</script></body></html>
