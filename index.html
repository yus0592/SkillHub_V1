const KEY='skills_forum_v1_posts';const seed=[{id:'sample1',category:'技術交流',trade:'CAD 機械設計製圖',title:'CAD 機械設計製圖訓練時，如何安排每日練習？',author:'製圖學習者',body:'想請教有經驗的選手或指導老師，平常會如何分配建模、組立與工程圖的練習時間？',date:'2026/10/28',likes:0,comments:[]},{id:'sample2',category:'競賽交流',trade:'',title:'第一次參加技能競賽，有哪些賽前準備建議？',author:'新手選手',body:'除了技術練習之外，想了解時間管理與賽前心態調整的經驗。',date:'2026/10/26',likes:0,comments:[]},{id:'sample3',category:'題目討論',trade:'電腦輔助機械製圖',title:'機械製圖題目中的尺寸標註有哪些常見錯誤？',author:'教學夥伴',body:'歡迎大家分享常見的尺寸標註問題與改善方式。',date:'2026/10/22',likes:0,comments:[]}];let posts=load();let page='home',current=null,filter='',search='';function load(){try{let s=localStorage.getItem(KEY);return s?JSON.parse(s):seed}catch{return seed}}function save(){localStorage.setItem(KEY,JSON.stringify(posts))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function navigate(p,id){page=p;current=id||null;filter='';search='';render();scrollTo(0,0)}function postHTML(p){return `<div class="post" onclick="navigate('article','${esc(p.id)}')"><span class="tag">${esc(p.category)}</span>${p.trade?`<span class="tag trade">${esc(p.trade)}</span>`:''}<h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.author)}</span><span>${esc(p.date)}</span><span>💬 ${p.comments.length} 則留言</span><span>♡ ${p.likes||0}</span></div></div>`}function listHTML(items){return `<div class="panel">${items.length?items.map(postHTML).join(''):'<div class="empty">目前沒有符合條件的討論</div>'}</div>`}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(page==='article'?'forum':page)));let a=document.getElementById('app');if(page==='library'){a.innerHTML='<div class="panel construction"><div class="symbol">🛠️</div><h1>題庫功能建置中</h1><p>競賽歷屆題目與訓練資源正在整理中。<br>此功能暫不開放，歡迎先到討論區交流。</p><button class="btn" onclick="navigate(\'forum\')">前往討論區</button></div>';return}if(page==='article'){let p=posts.find(x=>x.id===current);if(!p){navigate('forum');return}a.innerHTML=`<button class="back" onclick="navigate('forum')">← 返回討論區</button><div class="panel"><article class="article"><span class="tag">${esc(p.category)}</span>${p.trade?`<span class="tag trade">${esc(p.trade)}</span>`:''}<h1>${esc(p.title)}</h1><div class="meta">${esc(p.author)} · ${esc(p.date)}</div><div class="body">${esc(p.body)}</div><div class="actions"><button class="btn secondary" onclick="like('${esc(p.id)}')">♡ 按讚 (${p.likes||0})</button><button class="btn secondary" onclick="document.getElementById('commentbody').focus()">💬 留言 (${p.comments.length})</button></div></article><section class="comments"><h2>留言討論 (${p.comments.length})</h2>${p.comments.length?p.comments.map(c=>`<div class="comment"><div class="meta">${esc(c.author)} · ${esc(c.date)}</div><p>${esc(c.body)}</p></div>`).join(''):'<p class="muted">目前還沒有留言，歡迎分享你的想法。</p>'}<form class="commentform" onsubmit="addComment(event,'${esc(p.id)}')"><input id="commentauthor" required maxlength="20" placeholder="你的暱稱"><textarea id="commentbody" required maxlength="1000" placeholder="輸入留言內容…"></textarea><div><button class="btn">送出留言</button></div></form></section></div>`;return}let isHome=page==='home';let arr=posts.filter(p=>(!filter||p.category===filter)&&(!search||[p.title,p.body,p.author].join(' ').toLowerCase().includes(search.toLowerCase())));a.innerHTML=`${isHome?'<section class="hero"><div><h1>因技而聚，交流共進。</h1><p>技聚 SkillHub — 分享訓練經驗、討論競賽題目，<br>讓不同學校的選手與老師在這裡交流共進。</p></div><button class="btn" onclick="navigate(\'forum\')">探索討論區 →</button></section>':''}<section class="section"><div class="titlebar"><h2>${isHome?'最新討論':'討論區'}</h2><button class="btn" onclick="openModal()">＋ 發起討論</button></div>${isHome?'':`<div class="filters"><select id="cat" onchange="filter=this.value;refreshList()"><option value="">全部分類</option>${['技術交流','題目討論','競賽交流','綜合討論'].map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select><input id="query" placeholder="搜尋文章標題或內容" value="${esc(search)}" oninput="search=this.value;refreshList()"></div>`}<div id="listing">${listHTML(isHome?arr.slice(0,5):arr)}</div></section>${isHome?'<div style="text-align:center;margin-top:20px"><button class="btn secondary" onclick="navigate(\'forum\')">查看全部討論 →</button></div>':''}`}
function refreshList(){let arr=posts.filter(p=>(!filter||p.category===filter)&&(!search||[p.title,p.body,p.author].join(' ').toLowerCase().includes(search.toLowerCase())));document.getElementById('listing').innerHTML=listHTML(arr)}function openModal(){document.getElementById('overlay').classList.remove('hide')}function closeModal(){document.getElementById('overlay').classList.add('hide')}document.getElementById('postform').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);let p={id:'p'+Date.now(),author:f.get('author').trim(),category:f.get('category'),trade:f.get('trade'),title:f.get('title').trim(),body:f.get('body').trim(),date:new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}),likes:0,comments:[]};if(!p.author||!p.body||p.title.length<5)return;posts.unshift(p);save();e.target.reset();closeModal();navigate('article',p.id)});function like(id){let p=posts.find(x=>x.id===id);p.likes=(p.likes||0)+1;save();render()}function addComment(e,id){e.preventDefault();let p=posts.find(x=>x.id===id),author=document.getElementById('commentauthor').value.trim(),body=document.getElementById('commentbody').value.trim();if(!author||!body)return;p.comments.push({author,body,date:new Date().toLocaleDateString('zh-TW')});save();render()}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});render();
</script></body></html>
