<script>
const CONFIG={url:'https://vagomlwgdybzgdokcemm.supabase.co',key:'sb_publishable_HzMjGeZhCGPnuCtNLnYejA_SY1ELoxK'};
const ready=CONFIG.url.startsWith('https://')&&CONFIG.key.startsWith('sb_publishable_');
const db=ready&&window.supabase?window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:window.location?.protocol==='https:'}}):null;
let posts=[],page='home',current=null,filter='',search='',busy=false,user=null,isAdmin=false,loginOpen=false,sessionBusy=false;
let savedComment={author:'',body:''};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){return new Date(s).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})}
function notice(t){$('status').textContent=t}
function error(e){console.error(e);alert(e?.message||'操作失敗，請稍後再試。')}
function saveDraft(){if(page==='article'&&$('commentbody'))savedComment={author:$('commentauthor').value,body:$('commentbody').value}}
async function ensureIdentity(){if(!db)throw Error('無法載入 Supabase，請確認網路連線');
 const {data:{session}}=await db.auth.getSession();if(session?.user){user=session.user;return}
 const {data,error}=await db.auth.signInAnonymously();if(error)throw error;user=data.user;
}
async function checkAdmin(){clearQuestionCache();isAdmin=false;if(!user||user.is_anonymous)return;const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error)console.warn('管理員查詢失敗',error);else isAdmin=!!data;try{await memberRefresh()}catch(error){console.warn('會員資格讀取失敗',error)}}
async function refresh({quiet=false}={}){if(!db)return;if(sessionBusy)return;try{
 const [pr,cr,lr,clr]=await Promise.all([
 db.from('posts').select('id,author,category,trade,title,body,created_at').order('created_at',{ascending:false}).limit(200),
 db.from('comments').select('id,post_id,author,body,created_at,user_id').order('created_at',{ascending:true}).limit(2000),
 db.from('likes').select('id,post_id,user_id').limit(5000),
 db.from('comment_likes').select('id,comment_id,user_id').limit(5000)]);
 for(const r of [pr,cr,lr,clr])if(r.error)throw r.error;
 const cs=cr.data||[],ls=lr.data||[],cls=clr.data||[];
 posts=(pr.data||[]).map(p=>({...p,date:date(p.created_at),comments:cs.filter(c=>c.post_id===p.id).map(c=>({...c,date:date(c.created_at),likes:cls.filter(l=>l.comment_id===c.id).length,liked:cls.some(l=>l.comment_id===c.id&&l.user_id===user?.id)})),likes:ls.filter(l=>l.post_id===p.id).length,liked:ls.some(l=>l.post_id===p.id&&l.user_id===user?.id)}));
 if(!quiet)notice('');
 if(page==='energy'){if(!$('energy-card')||Boolean($('energy-admin-status'))!==isAdmin)renderEnergy();return}if(page==='library'||page==='about'){return}else if(page==='article'&&$('commentbody')){saveDraft();renderArticleContent();}else if(page==='forum'&&$('query')){renderListingOnly()}else render();

const ANNOUNCEMENT='<section class="test-announcement" aria-label="網站測試階段置頂公告"><div class="test-announcement-head"><span>📌 置頂公告</span><strong>技聚 SkillHub｜網站測試階段公告</strong></div><div class="test-announcement-body"><p>歡迎來到 <b>技聚 SkillHub</b>！這是一個以技職教育、技能競賽與技術交流為核心的共享平台，希望讓不同學校的選手、教師與技術愛好者，都能分享經驗、交流想法。</p><p><b>目前網站仍處於測試階段，尚未正式上線。</b>我們最希望聽見你的想法：<b>你期待技聚未來提供哪些功能？</b> 無論是歷屆競賽題庫、訓練資源共享、技術問答、競賽經驗交流，或其他實用功能，都歡迎到討論區提出建議，也歡迎測試發文、留言、按讚並回報問題。</p><p class="test-announcement-warning"><b>重要提醒：</b>測試期間的文章、留言與按讚等資料，預計在正式網站上線前統一清除，不會自動保留或轉移至正式版。請勿張貼個人敏感資料或機密資訊；網站功能與規則也可能持續調整。</p><p>每一則建議，都是讓技聚變得更好的重要參考。感謝你一起參與！<br><b>因技而聚，交流共進。</b> — 技聚 SkillHub 管理團隊</p><button type="button" class="btn secondary" onclick="navigate(\'forum\')">前往討論區分享建議</button></div></section>';
function postHTML(p){return `<div class="post" onclick="navigate('article','${esc(p.id)}')"><span class="tag">${esc(p.category)}</span>${p.trade?`<span class="tag trade">${esc(p.trade)}</span>`:''}<h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.author)}</span><span>${esc(p.date)}</span><span>💬 ${p.comments.length} 則留言</span><span>♡ ${p.likes||0}</span></div></div>`}

function filtered(){return posts.filter(p=>(!filter||p.category===filter)&&(!search||[p.title,p.body,p.author].join(' ').toLowerCase().includes(search.toLowerCase())))}
function renderArticleContent(){let p=posts.find(x=>x.id===current);if(!p){page='forum';render();return}const a=$('app');a.innerHTML=`<button class="back" onclick="navigate('forum')">← 返回討論區</button><div class="panel"><article class="article"><span class="tag">${esc(p.category)}</span>${p.trade?`<span class="tag trade">${esc(p.trade)}</span>`:''}<h1>${esc(p.title)}</h1><div class="meta">${esc(p.author)} · ${esc(p.date)}</div><div class="body">${esc(p.body)}</div><div class="actions"><button class="btn secondary" ${p.liked?'disabled':''} onclick="likePost('${esc(p.id)}')">${p.liked?'♥ 已按讚':'♡ 按讚'} (${p.likes||0})</button><button class="btn secondary" onclick="$('commentbody').focus()">💬 留言 (${p.comments.length})</button>${isAdmin?`<button class="btn danger" onclick="deletePost('${esc(p.id)}')">刪除整篇討論</button>`:''}</div></article><section class="comments"><h2>留言討論 (${p.comments.length})</h2>${p.comments.length?p.comments.map(c=>`<div class="comment"><div class="meta">${esc(c.author)} · ${esc(c.date)}</div><p>${esc(c.body)}</p><div class="comment-actions"><button class="btn secondary small" ${c.liked?'disabled':''} onclick="likeComment('${esc(c.id)}')">${c.liked?'♥ 已按讚':'♡ 按讚'} (${c.likes})</button>${(isAdmin||(user&&c.user_id===user.id))?`<button class="btn danger small" onclick="deleteComment('${esc(c.id)}')">刪除留言</button>`:''}</div></div>`).join(''):'<p class="muted">目前還沒有留言，歡迎分享你的想法。</p>'}<form class="commentform" onsubmit="addComment(event,'${esc(p.id)}')"><input id="commentauthor" required maxlength="20" placeholder="你的暱稱" oninput="saveDraft()" value="${esc(savedComment.author)}"><textarea id="commentbody" required maxlength="1000" placeholder="輸入留言內容…" oninput="saveDraft()">${esc(savedComment.body)}</textarea><div><button class="btn" type="submit">送出留言</button></div></form></section></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(page==='article'?'forum':page)));let a=$('app');
 if(page==='about'){a.innerHTML="<article class=\"about-page\" aria-labelledby=\"about-title\">\n  <div class=\"hero\">\n    <div><h1 id=\"about-title\">關於技聚</h1><p>因技而聚，交流共進。</p></div>\n  </div>\n  <section class=\"panel article about-story\" aria-labelledby=\"about-origin\">\n    <div class=\"about-story-content\">\n      <h2 id=\"about-origin\">技聚的起源｜讓每一份努力，都能成為下一個人的起點</h2>\n      <blockquote class=\"about-questions\">\n        <p>「學長，你還有以前的比賽題目嗎？」</p>\n        <p>「這題到底要怎麼畫？」</p>\n        <p>「去年的訓練資料到底存在哪裡啊？」🤯</p>\n      </blockquote>\n      <p>這些問題，是不是有點熟悉？</p>\n      <p>在技能競賽的訓練過程中，每一屆選手都投入無數時間練習，累積了大量的試題、作品與寶貴經驗。但隨著比賽結束、選手畢業，這些資源可能就這樣靜靜地躺在某個硬碟裡，甚至逐漸消失。</p>\n      <p><strong>明明大家都走過相似的路，為什麼下一屆還得重新摸索一次？</strong></p>\n      <p>更重要的是，不同學校擁有的訓練資源並不相同。有些選手能取得豐富的歷屆試題與指導經驗，有些選手卻只能靠自己四處尋找。</p>\n      <p>於是，一個想法誕生了：</p>\n      <p class=\"about-idea\"><strong>「如果能有一個地方，把大家累積的資源與經驗聚集起來，那該有多好？」</strong> 💡</p>\n      <p>這就是「技聚 SkillHub」的起點。</p>\n      <p>我們希望打造一個屬於技職人的資源共享與交流平台，從 <strong>CAD 機械設計製圖</strong> 出發，讓歷屆試題得以保存、訓練經驗能夠傳承，也讓來自不同學校的選手與老師有機會交流、共同成長。</p>\n      <p>技聚不只是收集題目的地方，更希望成為連結技術、知識與人的橋梁。</p>\n      <p>目前，技聚仍處於測試與構想驗證階段。我們希望先聽聽大家的聲音，如果有足夠的支持與需求，就一起推動平台的完整建置與正式上線。</p>\n      <p><strong>因技而聚，交流共進。</strong></p>\n      <p>讓資源不再受限於學校，讓經驗不再止步於畢業，讓每一份曾經付出的努力，都有機會成為下一位選手前進的力量。✨</p>\n    </div>\n  </section>\n  <section class=\"panel article about-team-section\" aria-labelledby=\"about-team\">\n    <h2 id=\"about-team\">製作團隊｜域見未來</h2>\n    <div class=\"about-team-layout\">\n      <img class=\"about-team-logo\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAFACAYAAADNkKWqAAAAtGVYSWZJSSoACAAAAAYAEgEDAAEAAAABAAAAGgEFAAEAAABWAAAAGwEFAAEAAABeAAAAKAEDAAEAAAACAAAAEwIDAAEAAAABAAAAaYcEAAEAAABmAAAAAAAAAGAAAAABAAAAYAAAAAEAAAAGAACQBwAEAAAAMDIxMAGRBwAEAAAAAQIDAACgBwAEAAAAMDEwMAGgAwABAAAA//8AAAKgBAABAAAAQAEAAAOgBAABAAAAQAEAAAAAAACNe0tCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAFbmlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSdXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQnPz4KPH async function qLoad(){
 const version=++qVersion;qLoading=true;qError='';qRows=[];qCloseEditor();qRenderResults();
 try{
  if(!db)throw Error('Supabase 尚未連線，請檢查網路後重試。');

  if(isAdmin&&qFilters.status)query=query.eq('status',qFilters.status);
  // Restrict PostgREST filter syntax to a literal CJK/letter/number search term.
  const term=qFilters.keyword.replace(/[^\p{L}\p{N}\s-]/gu,' ').trim().replace(/\s+/g,' ');
  if(qFilters.keyword&&!term)throw Error('請輸入文字或數字關鍵字。');
  if(term)query=query.or(['title','description','preview_content'].map(c=>`${c}.ilike.%${term}%`).join(','));
  const r=await query.order('year',{ascending:false}).order('created_at',{ascending:false}).order('id',{ascending:false}).range(qOffset,qOffset+19);
  if(r.error)throw r.error;if(version!==qVersion)return;
  qRows=r.data||[];qTotal=r.count||0;qLoaded=true;
 }catch(e){if(version!==qVersion)return;console.error(e);qError='題庫讀取失敗，請重新載入後再試。'+(e.message?'（'+e.message+'）':'')}
 finally{if(version===qVersion){qLoading=false;qRenderResults()}}
}

async function qDownloadParts(id){

 const button=$('q-parts-download'),status=$('q-parts-status');
 if(!file||!button||!status||button.disabled)return;
 const version=qEditVersion;
 button.disabled=true;
 status.textContent='正在下載零件檔…';
 try{
  const result=await db.storage.from(QB_PARTS_BUCKET).download(file.path);
  if(version!==qEditVersion||page!=='library')return;
  if(result.error)throw result.error;
  const url=URL.createObjectURL(result.data);
  const link=document.createElement('a');
  link.href=url;link.download=file.name;
  document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  status.textContent='下載已開始。';
 }catch(error){if(version===qEditVersion)status.textContent='下載失敗，請重新載入題庫後再試。'}
 finally{button.disabled=false}
}

 }catch(e){if(version===qPdfVersion)view.textContent='PDF 載入失敗，題目可能已下架或尚未完成檔案權限設定。請重新載入題庫後再試。'+(e.message?'（'+e.message+'）':'')}
 finally{if(button)button.disabled=false}
}
async function qOpenPdfInventory(){
 if(!isAdmin||qSaving)return;
 qCloseEditor();
 const version=qEditVersion;
 const current=()=>isAdmin&&page==='library'&&version===qEditVersion;
 const editor=$('q-editor');
 editor.innerHTML=`<section class="panel article" id="q-inventory" tabindex="-1"><div class="titlebar"><h2>PDF 檔案清單</h2><button class="btn secondary" onclick="qCloseEditor()">關閉</button></div><label>搜尋檔名或題目 <input id="q-inventory-search" type="search" disabled></label><p id="q-inventory-status" role="status">正在讀取 PDF 清單…</p><div id="q-inventory-list"></div><div id="q-inventory-preview" aria-live="polite"></div></section>`;
 $('q-inventory').focus();
 const status=$('q-inventory-status'),list=$('q-inventory-list'),search=$('q-inventory-search'),preview=$('q-inventory-preview');
 const pageSize=100;
 try{
  const attachments=new Map();
  for(let offset=0;current();offset+=pageSize){
   const {data,error}=await db.from('question_bank').select('id,title,status,pdf_files').order('id').range(offset,offset+pageSize-1);
   if(error)throw error;
   for(const question of data)for(const file of qFiles(question)){
    const links=attachments.get(file.path)||[];
    links.push({name:file.name,title:question.title,status:qStatus(question.status)});
    attachments.set(file.path,links);
   }
   if(data.length<pageSize)break;
  }
  const files=[];
  for(let offset=0;current();offset+=pageSize){
   const {data,error}=await db.storage.from(QB_PDF_BUCKET).list('',{limit:pageSize,offset,sortBy:{column:'name',order:'asc'}});
   if(error)throw error;
   for(const object of data){
    if(!object.id||!object.name.toLowerCase().endsWith('.pdf'))continue;
    const links=attachments.get(object.name)||[];
    files.push({path:object.name,name:links[0]?.name||object.name,links,created:object.created_at,size:object.metadata?.size});
   }
   if(data.length<pageSize)break;
  }
  if(!current())return;
  files.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
  function showFiles(){
   qClearPdf();preview.replaceChildren();
   const term=search.value.trim().toLowerCase();
   const matches=files.filter(file=>[file.path,...file.links.flatMap(link=>[link.name,link.title,link.status])].some(value=>value.toLowerCase().includes(term)));
   status.textContent=`顯示 ${matches.length} 份，共 ${files.length} 份 PDF`;
   list.innerHTML=matches.map((file,index)=>`<div class="q-attachment"><strong>${esc(file.name)}</strong><p class="meta">${esc(file.links.map(link=>`${link.title}（${link.status}）`).join('、')||'未綁定題目')}${file.created?' · '+esc(date(file.created)):''}${file.size!=null?' · '+esc(qSize(file.size)):''}</p><button class="btn secondary" data-file-index="${index}">閱讀 PDF</button></div>`).join('')||'<p class="muted">目前沒有符合條件的 PDF。</p>';
   for(const button of list.querySelectorAll('[data-file-index]'))button.onclick=()=>{
    if(current())qDisplayPdf(matches[Number(button.dataset.fileIndex)],preview,button);
   };
  }
  search.disabled=false;search.addEventListener('input',showFiles);showFiles();
 }catch(error){if(current())status.textContent='讀取 PDF 清單失敗：'+(error.message||'請稍後再試。')}
}

 <label>提供零件檔（選填，ZIP，最大 20 MB）<input name="parts_file" type="file" accept=".zip,application/zip,application/x-zip-compressed"></label>

 <label>狀態<select name="status">${['draft','published','archived'].map(s=>`<option value="${s}" ${q.status===s?'selected':''}>${qStatus(s)}</option>`).join('')}</select></label>

function qEditType(type){const f=$('q-edit');f.elements.trade.innerHTML=qOptions(QB_TYPES[type].trades);f.elements.stage.innerHTML=qOptions(QB_TYPES[type].stages)}
function qPdfSelected(input){const files=Array.from(input.files||[]);$('q-file-status').textContent=files.length?'待新增 '+files.length+' 份：'+files.map(f=>f.name+'（'+qSize(f.size)+'）').join('、')+'。按「儲存題目」開始上傳。':'沒有選擇新檔；未勾選移除的原有附件會保留。'}
async function qValidatePdf(file){
 if(!/\.pdf$/i.test(file.name))throw Error('請選擇 .pdf 檔案。');
 if(file.name.length>255)throw Error('PDF 檔名請縮短至 255 字以內。');
 if(file.size<5||file.size>QB_PDF_MAX)throw Error('PDF 大小必須介於 5 bytes 與 20 MB。');
 const bytes=new Uint8Array(await file.slice(0,5).arrayBuffer());
 if(String.fromCharCode(...bytes)!=='%PDF-')throw Error('檔案不是有效的 PDF，請勿只修改副檔名。');
}
async function qValidateParts(file){
 if(!/\.zip$/i.test(file.name))throw Error('零件檔請選擇 ZIP 壓縮檔。');
 if(file.name.length>255||file.size<22||file.size>QB_PARTS_MAX)throw Error('零件檔大小須在 20 MB 以內，檔名須在 255 字以內。');
 const signature=new DataView(await file.slice(0,4).arrayBuffer()).getUint32(0);
 if(signature!==0x504b0304&&signature!==0x504b0506)throw Error('零件檔不是可辨識的 ZIP，請重新壓縮後上傳。');
}
async function qSave(e){e.preventDefault();if(!isAdmin||qSaving)return;const f=new FormData(e.target),id=f.get('id'),version=f.get('updated_at'),payload={},editVersion=qEditVersion,actor=user?.id;
 for(const k of ['title','competition_type','trade','stage','description','preview_content','status'])payload[k]=String(f.get(k)||'').trim();payload.year=Number(f.get('year'));
 if(!payload.title)return;if(payload.status==='published'&&!confirm('確認發布題目資訊，並開放通過資格驗證的會員閱讀及下載完整 PDF 與零件檔？'))return;
 qSaving=true;$('q-save').disabled=true;
 let uploaded=false,committed=false;
 try{
  const parts=f.get('parts_file');
  if(parts?.name)await qValidateParts(parts);
  const files=f.getAll('pdf_file').filter(file=>file?.name),removed=new Set(f.getAll('remove_pdf'));
  if(files.length||removed.size){
   const existing=id?qRows.find(q=>q.id===id):null;if(id&&!existing)throw Error('題目資料已變更，請重新載入後再編輯。');
   const attachments=qFiles(existing).filter(file=>!removed.has(file.path));
   if(attachments.length+files.length>3)throw Error('每題最多 3 份 PDF，請減少新檔或勾選移除舊附件。');
   // 先驗證整批，任何一份不合格都不開始上傳。
   for(const file of files)await qValidatePdf(file);
   for(const [i,file] of files.entries()){
    if(!isAdmin||user?.id!==actor||qEditVersion!==editVersion)throw Error('頁面或登入身分已變更，題目未繼續儲存。');
    $('q-save-status').textContent=`正在上傳第 ${i+1}／${files.length} 份 PDF，請保持此頁開啟…`;
    const attachment={path:crypto.randomUUID()+'.pdf',name:file.name,size:file.size};
    const upload=await db.storage.from(QB_PDF_BUCKET).upload(attachment.path,file,{contentType:'application/pdf',cacheControl:'0',upsert:false});
    if(upload.error)throw upload.error;uploaded=true;attachments.push(attachment);
   }
   payload.pdf_files=attachments;
  }
  if(!isAdmin||user?.id!==actor||qEditVersion!==editVersion)throw Error('頁面或登入身分已變更，題目未繼續儲存。');
  if(parts?.name){
   $('q-save-status').textContent='正在上傳零件 ZIP…';
   const attachment={path:crypto.randomUUID()+'.zip',name:parts.name,size:parts.size};
   // Multipart uses the Blob's MIME type, which can differ from the upload options.
   const zip=new Blob([parts],{type:'application/zip'});
   const upload=await db.storage.from(QB_PARTS_BUCKET).upload(attachment.path,zip,{contentType:'application/zip',cacheControl:'0',upsert:false});
   if(upload.error)throw upload.error;
   uploaded=true;
   payload.parts_file=attachment;
  }else if(f.get('remove_parts'))payload.parts_file=null;
  if(!isAdmin||user?.id!==actor||qEditVersion!==editVersion)throw Error('頁面或登入身分已變更，題目未繼續儲存。');
  $('q-save-status').textContent='正在儲存題目…';
  const query=id?db.from('question_bank').update(payload).eq('id',id).eq('updated_at',version):db.from('question_bank').insert(payload);
  const r=await query.select('id').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('資料已被其他管理員修改、已不存在，或目前沒有編輯權限。請重新載入後再編輯。');
  committed=true;if(editVersion===qEditVersion){qCloseEditor();qOffset=0;await qLoad()}
 }catch(e){let message='儲存失敗：'+e.message;if(uploaded&&!committed)message+=' 已上傳的檔案保留為私人檔案；若結果不明，請先重新載入確認題目，再決定是否重試。';const el=$('q-save-status');if(editVersion===qEditVersion&&el)el.textContent=message;else error(new Error(message))}
 finally{qSaving=false;if($('q-save'))$('q-save').disabled=false}
}

async function memberPrepareProof(input){
 memberClearProof();
 const version=memberProofVersion,file=input.files[0];
 const preview=$('member-proof-preview'),button=$('member-proof-submit');
 preview.hidden=true;preview.removeAttribute('src');button.disabled=true;
 if(!file){memberMessage('');return}
 if(!/\.(jpe?g|png)$/i.test(file.name)||!file.size||file.size>5242880){
  memberMessage('請選擇 5 MB 以內的 JPG 或 PNG 照片。');return;
 }
 memberMessage('正在產生加註浮水印的預覽…');
 let bitmap;
 try{
  const bytes=new Uint8Array(await file.slice(0,8).arrayBuffer());
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  const signature=/\.png$/i.test(file.name)?'89504e470d0a1a0a':'ffd8ff';
  if(!hex.startsWith(signature))throw Error('照片內容與副檔名不符。');
  if(version!==memberProofVersion)return;
  bitmap=await createImageBitmap(file);
  if(version!==memberProofVersion)return;
  const canvas=document.createElement('canvas');
  const scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height));
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const context=canvas.getContext('2d');
  context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
  context.drawImage(bitmap,0,0,canvas.width,canvas.height);
  const dateText=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());
  const fontSize=Math.max(12,Math.min(canvas.width*0.042,canvas.height*0.085));
  context.font=`bold ${fontSize}px system-ui, sans-serif`;
  context.textAlign='center';context.textBaseline='middle';
  context.fillStyle='rgba(18,41,61,.68)';context.strokeStyle='rgba(255,255,255,.75)';
  context.lineWidth=Math.max(1,fontSize*0.10);
  const watermark=`僅供技聚 SkillHub 內部資格審核｜${dateText}`;
  for(const position of [0.22,0.50,0.78]){
   const x=canvas.width/2,y=canvas.height*position;
   context.strokeText(watermark,x,y,canvas.width*0.92);
   context.fillText(watermark,x,y,canvas.width*0.92);
  }
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));
  if(version!==memberProofVersion)return;
  if(!blob||blob.size>5242880)throw Error('無法產生 5 MB 以內的預覽，請換一張照片。');
  memberProof={file,blob,url:URL.createObjectURL(blob)};
  preview.src=memberProof.url;preview.hidden=false;button.disabled=false;
  memberMessage('請確認加註後的照片可辨識，再按「送出資格驗證」。');
 }catch(error){if(version===memberProofVersion)memberMessage(error.message||'無法處理這張照片，請換一張再試。')}
 finally{bitmap?.close()}
}

function energyWrapText(context,text,width){
 const normalized=text.trim().replace(/\s+/g,' ');
 const parts=typeof Intl.Segmenter==='function'
  ? Array.from(new Intl.Segmenter('zh-Hant',{granularity:'word'}).segment(normalized),part=>part.segment)
  : Array.from(normalized);
 const lines=[];
 let line='';
 for(const part of parts){
  if(context.measureText(line+part).width<=width){line+=line?part:part.trimStart();continue}
  if(line)lines.push(line.trimEnd());
  line='';
  for(const character of Array.from(part.trimStart())){
   if(line&&context.measureText(line+character).width>width){lines.push(line);line=''}
   line+=character;
  }
 }
 if(line)lines.push(line.trimEnd());
 return lines;
}

 const draw=energyReadDraw(),card=draw&&energyPool().find(item=>item.id===draw.id);
 const status=$('energy-save-status');
 if(!card||button.disabled)return;
 button.disabled=true;
 status.hidden=true;
 try{
  const canvas=document.createElement('canvas');
  canvas.width=1080;canvas.height=1350;
  const context=canvas.getContext('2d');
  if(!context)throw Error('無法建立卡片圖片');
  const font='system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  const left=94,width=892;
  const background=context.createLinearGradient(0,0,1080,1350);
  background.addColorStop(0,'#183752');background.addColorStop(1,'#102237');
  context.fillStyle=background;context.fillRect(0,0,1080,1350);
  context.strokeStyle='#87b2d45c';context.lineWidth=2;context.strokeRect(48,48,984,1254);
  context.fillStyle='#ffda80';context.fillRect(left,116,72,5);
  context.textBaseline='top';
  context.font=`700 36px ${font}`;context.fillText('能量補給',left,148,width);
  context.font=`600 27px ${font}`;context.fillText(energyCardLabel(card),left,207,width);

  let size=76,lines,lineHeight;
  do{
   context.font=`700 ${size}px ${font}`;
   lines=energyWrapText(context,card.quote,width);
   lineHeight=Math.ceil(size*1.45);
   if(lines.length*lineHeight<=740||size<=36)break;
   size-=4;
  }while(true);
  const start=280+Math.max(0,(740-lines.length*lineHeight)/2);
  context.fillStyle='#ffffff';
  lines.forEach((line,index)=>context.fillText(line,left,start+index*lineHeight,width));
  if(card.credit){
   context.fillStyle='#deebf6';context.font=`500 28px ${font}`;
   energyWrapText(context,card.credit,width).forEach((line,index)=>context.fillText(line,left,1030+index*40,width));
  }
  context.fillStyle='#ffda80';context.fillRect(left,1190,width,2);
  const logo=document.querySelector('header .brand-mark img');
  await logo.decode();
  const logoScale=Math.min(90/logo.naturalWidth,62/logo.naturalHeight);
  const logoWidth=logo.naturalWidth*logoScale,logoHeight=logo.naturalHeight*logoScale;
  context.drawImage(logo,left,1241-logoHeight/2,logoWidth,logoHeight);
  const brandLeft=left+logoWidth+20;
  context.textBaseline='middle';context.font=`700 30px ${font}`;
  context.fillText('技聚 SkillHub',brandLeft,1241,left+width-brandLeft);

  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw Error('無法輸出 PNG');
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download=`技聚-能量補給-${draw.day}.png`;
  document.body.append(link);
  try{link.click()}finally{link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  status.textContent='已開始下載 PNG。';
 }catch(error){status.textContent='暫時無法儲存卡片，請再試一次。'}
 finally{button.disabled=false;status.hidden=false}
}
async function energyLoadCards(){
 if(energyLoading||energySaving)return;
 energyLoading=true;
 energyRenderCard();
 try{
  const cards=[];
  if(db){
   const pageSize=100;
   for(let offset=0;;offset+=pageSize){
    const {data,error}=await db.from('skillhub_energy_cards').select('id,series,category,quote,credit').eq('published',true).order('id').range(offset,offset+pageSize-1);
    if(error)throw error;
    cards.push(...data);
    if(data.length<pageSize)break;
   }
  }
  energyRemoteCards=cards;
  energyLoadError=false;
 }catch(error){
  energyRemoteCards=energyRemoteCards||[];
  energyLoadError=true;
 }finally{
  energyLoading=false;
  if(page==='energy'){
   energyRenderCard();
   const status=$('energy-admin-status');
   if(status&&energyLoadError&&!status.textContent)status.textContent='目前無法讀取新增卡片。請確認已完成資料庫設定，或稍後再試。';
  }
 }
}
function energyChangeSeries(select){
 const form=select.form;
 const community=select.value==='community';
 form.querySelector('[data-energy-category]').hidden=community;
 form.elements.category.disabled=community;
 form.querySelector('[data-energy-credit]').hidden=!community;
 form.elements.credit.disabled=!community;
}
function renderEnergy(){
 $('app').innerHTML=`<div class="energy-page">
  <section class="energy-hero" aria-labelledby="energy-title">
   <div class="energy-intro"><h1 id="energy-title">能量補給</h1><p>給正在練習、準備上場，或想重新出發的你。每天抽一張卡，帶一句鼓勵繼續往前。</p><time datetime="${energyDate()}">${energyDate().replaceAll('-',' / ')}</time></div>
   <div id="energy-card" class="energy-card" aria-live="polite"></div>
  </section>
  <section class="energy-community" aria-labelledby="energy-community-title"><div><h2 id="energy-community-title">一句話的力量</h2><p>有沒有一句話，想留給下一位選手？歡迎分享。經審核的投稿會加入每日卡池。</p></div><a class="btn secondary" href="${ENERGY_SUBMISSION_URL}" target="_blank" rel="noopener noreferrer">留下一句鼓勵 ↗</a></section>
  ${isAdmin?`<section class="panel article energy-admin"><h2>管理卡片</h2><form class="form" onsubmit="energyAddCard(event)">
   <label>卡片系列<select name="series" onchange="energyChangeSeries(this)"><option value="featured">技聚精選</option><option value="community">來自大家的一句話</option></select></label>
   <label data-energy-category>分類<select name="category">${ENERGY_CATEGORIES.map(group=>`<option value="${group.id}">${esc(group.label)}</option>`).join('')}</select></label>
   <label data-energy-credit hidden>公開署名或身分（選填）<input name="credit" maxlength="60" placeholder="例如：歷屆選手" disabled></label>
   <label>卡片文字<textarea name="quote" maxlength="180" rows="3" required></textarea></label>
   <div><button type="submit" class="btn">上架卡片</button></div><p id="energy-admin-status" role="status" class="muted">${energyLoadError?'目前無法讀取新增卡片。':''}</p>
  </form></section>`:''}
 </div>`;
 energyRenderCard();
 void energyLoadCards();
}
async function energyAddCard(event){
 event.preventDefault();
 if(!isAdmin||!db||energySaving)return;
 const form=event.currentTarget,fields=new FormData(form),status=$('energy-admin-status');
 if(energyLoading){status.textContent='正在讀取卡池，請稍候再上架。';return}
 const series=fields.get('series'),quote=String(fields.get('quote')||'').trim();
 if(!quote){status.textContent='請輸入卡片文字。';return}
 if(series==='community'&&!confirm('確認這則投稿及所填署名已獲同意公開？'))return;
 const payload={series,quote,category:series==='featured'?fields.get('category'):null,
  credit:series==='community'?String(fields.get('credit')||'').trim()||null:null};
 const button=form.querySelector('button[type="submit"]');
 energySaving=true;button.disabled=true;status.textContent='正在上架卡片…';
 try{
  const {data,error}=await db.from('skillhub_energy_cards').insert(payload).select('id,series,category,quote,credit').single();
  if(error)throw error;
  energyRemoteCards=(energyRemoteCards||[]).filter(card=>card.id!==data.id).concat(data);
  form.elements.quote.value='';form.elements.credit.value='';
  status.textContent='卡片已上架，會出現在之後的抽卡中。';
 }catch(error){status.textContent='上架失敗：'+(error.message||'請稍後再試。')}
 finally{energySaving=false;button.disabled=false}
}

</script></body></html>
